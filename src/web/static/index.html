<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pocket Sync</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <!-- Everything below is rendered by Preact — see src/web/ui/. -->
    <div id="app"></div>
    <!-- Must be type="module": the bundle is ESM, and as a classic script its
         top-level bindings would land on window (where `status` collides with
         the built-in window.status and silently breaks the store). -->
    <script type="module" src="/app.js"></script>
  </body>
</html>
